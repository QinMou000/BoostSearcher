<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Boost Searcher</title>
    <style>
        :root {
            --bg: #ffffff;
            --surface: #ffffff;
            --text: #202428;
            --muted: #6b747c;
            --line: #dfe5e2;
            --accent: #176f8f;
            --accent-strong: #105775;
            --shadow: 0 18px 48px rgba(20, 28, 34, 0.08);
        }

        [data-theme="dark"] {
            --bg: #000000;
            --surface: #000000;
            --text: #e7ebef;
            --muted: #aab3bb;
            --line: #363d43;
            --accent: #6ab6d6;
            --accent-strong: #95d0ec;
            --shadow: 0 18px 48px rgba(0, 0, 0, 0.28);
        }

        * { box-sizing: border-box; }

        body {
            min-height: 100vh;
            margin: 0;
            background: var(--bg);
            color: var(--text);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
            line-height: 1.7;
        }

        button, input { font: inherit; }

        .page {
            width: min(900px, calc(100% - 32px));
            margin: 0 auto;
            padding: 48px 0 32px;
        }

        .site-header {
            margin-bottom: 42px;
            text-align: center;
        }

        .site-title {
            margin: 0;
            font-size: clamp(34px, 6vw, 54px);
            font-weight: 600;
            line-height: 1.12;
        }

        .site-subtitle {
            margin: 12px 0 18px;
            color: var(--muted);
            font-size: 15px;
        }

        .nav {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 18px;
            color: var(--muted);
            font-size: 14px;
        }

        .nav a {
            color: var(--muted);
            text-decoration: none;
        }

        .nav a:hover { color: var(--accent); }

        .theme-button {
            display: inline-grid;
            width: 34px;
            height: 34px;
            place-items: center;
            border: 1px solid var(--line);
            border-radius: 50%;
            background: var(--surface);
            color: var(--text);
            cursor: pointer;
        }

        .search-panel {
            margin-bottom: 30px;
            padding: 24px;
            border: 1px solid var(--line);
            border-radius: 8px;
            background: var(--surface);
            box-shadow: var(--shadow);
        }

        .search-row {
            display: grid;
            grid-template-columns: minmax(0, 1fr) 96px;
            gap: 10px;
        }

        .search-input {
            min-width: 0;
            border: 1px solid var(--line);
            border-radius: 6px;
            background: var(--bg);
            color: var(--text);
            padding: 11px 13px;
            outline: none;
        }

        .search-input:focus {
            border-color: var(--accent);
            box-shadow: 0 0 0 3px rgba(23, 111, 143, 0.15);
        }

        .search-button {
            border: 1px solid var(--accent);
            border-radius: 6px;
            background: var(--accent);
            color: #fff;
            cursor: pointer;
        }

        .search-button:hover { background: var(--accent-strong); }

        .status {
            min-height: 24px;
            margin-top: 12px;
            color: var(--muted);
            font-size: 14px;
        }

        .archive-title {
            margin: 0 0 8px;
            font-size: 26px;
            font-weight: 600;
        }

        .result-list {
            border-top: 1px solid var(--line);
        }

        .result-item {
            display: grid;
            grid-template-columns: 70px minmax(0, 1fr);
            gap: 16px;
            width: 100%;
            padding: 18px 0;
            border-bottom: 1px solid var(--line);
            color: var(--text);
            text-align: left;
            text-decoration: none;
        }

        .result-item:hover { color: var(--accent); }

        .result-date {
            color: var(--muted);
            font-size: 13px;
        }

        .result-title {
            display: block;
            margin-bottom: 4px;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.45;
        }

        .result-desc {
            display: -webkit-box;
            overflow: hidden;
            color: var(--muted);
            font-size: 14px;
            -webkit-box-orient: vertical;
            -webkit-line-clamp: 2;
        }

        .result-path {
            display: block;
            margin-top: 6px;
            overflow: hidden;
            color: var(--muted);
            font-family: Consolas, "Liberation Mono", monospace;
            font-size: 12px;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .footer {
            margin-top: 44px;
            color: var(--muted);
            font-size: 13px;
            text-align: center;
        }

        @media (max-width: 560px) {
            .page { width: min(100% - 22px, 900px); padding-top: 32px; }
            .search-row { grid-template-columns: 1fr; }
            .result-item { grid-template-columns: 48px minmax(0, 1fr); }
        }
    </style>
</head>

<body>
    <main class="page">
        <header class="site-header">
            <h1 class="site-title">Boost Searcher</h1>
            <nav class="nav" aria-label="站点导航">
                <button class="theme-button" id="themeToggle" type="button" aria-label="切换深浅色主题">☾</button>
            </nav>
        </header>

        <section class="search-panel" aria-label="搜索">
            <form id="searchForm">
                <div class="search-row">
                    <input class="search-input" id="searchInput" type="search" placeholder="输入关键词搜索文档" autocomplete="off">
                    <button class="search-button" type="submit">搜索</button>
                </div>
                <div class="status" id="statusText">输入关键词后按 Enter 搜索。</div>
            </form>
        </section>

        <section id="archives" aria-label="搜索结果">
            <h2 class="archive-title">Archives</h2>
            <div class="result-list" id="resultList"></div>
        </section>

        <footer class="footer">© 2026 Boost Searcher · Theme inspired by Coder</footer>
    </main>

    <script>
        const form = document.getElementById("searchForm");
        const input = document.getElementById("searchInput");
        const statusText = document.getElementById("statusText");
        const resultList = document.getElementById("resultList");
        const themeToggle = document.getElementById("themeToggle");

        initTheme();
        form.addEventListener("submit", function(event) {
            event.preventDefault();
            searchDocs();
        });
        themeToggle.addEventListener("click", toggleTheme);

        function initTheme() {
            const saved = localStorage.getItem("boost-searcher-theme");
            const prefersDark = window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches;
            setTheme(saved || (prefersDark ? "dark" : "light"));
        }

        function toggleTheme() {
            const next = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
            setTheme(next);
            localStorage.setItem("boost-searcher-theme", next);
        }

        function setTheme(theme) {
            document.documentElement.dataset.theme = theme;
            themeToggle.textContent = theme === "dark" ? "☀" : "☾";
        }

        async function searchDocs() {
            const query = input.value.trim();
            resultList.innerHTML = "";
            if (!query) {
                statusText.textContent = "输入关键词后按 Enter 搜索。";
                return;
            }

            statusText.textContent = "正在搜索...";
            try {
                const response = await fetch("/s?word=" + encodeURIComponent(query), {
                    headers: { "Accept": "application/json" }
                });
                if (!response.ok) throw new Error("搜索请求失败");

                const text = await response.text();
                const results = text.trim() ? JSON.parse(text) : [];
                if (!Array.isArray(results) || results.length === 0) {
                    statusText.textContent = "没有找到相关文章。";
                    return;
                }

                statusText.textContent = "共找到 " + results.length + " 篇文档。";
                renderResults(results, query);
            } catch (error) {
                statusText.textContent = "搜索失败，请稍后再试。";
            }
        }

        // 根据后端命中词生成安全正则，并按长度降序避免短词抢先匹配长词。
        function buildKeywordRegex(keywords) {
            const source = Array.isArray(keywords) ? keywords : String(keywords || "").trim().split(/\s+/);
            const seen = new Set();
            const parts = source.map(function(part) {
                return String(part || "").trim();
            }).filter(function(part) {
                if (!part || seen.has(part)) return false;
                seen.add(part);
                return true;
            }).sort(function(left, right) {
                return right.length - left.length;
            }).map(function(part) {
                return part.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
            });
            return parts.length ? new RegExp("(" + parts.join("|") + ")", "gi") : null;
        }

        // 后端 keywords 表示实际命中词，原始 query 只作为旧接口或空数组的兜底高亮词。
        function collectHighlightKeywords(item, fallbackKeyword) {
            const keywords = Array.isArray(item.keywords) ? item.keywords.slice() : [];
            if (fallbackKeyword) {
                keywords.push(fallbackKeyword);
            }
            return keywords;
        }

        // 用文本节点和 span 组合高亮结果，避免摘要内容绕过 HTML 转义。
        function appendHighlightedText(parent, text, keywordRegex) {
            const source = String(text || "");
            if (!keywordRegex) {
                parent.textContent = source;
                return;
            }

            let cursor = 0;
            keywordRegex.lastIndex = 0;
            source.replace(keywordRegex, function(match, _word, offset) {
                if (offset > cursor) {
                    parent.appendChild(document.createTextNode(source.slice(cursor, offset)));
                }
                const mark = document.createElement("span");
                mark.style.color = "red";
                mark.style.fontWeight = "600";
                mark.textContent = match;
                parent.appendChild(mark);
                cursor = offset + match.length;
                return match;
            });
            if (cursor < source.length) {
                parent.appendChild(document.createTextNode(source.slice(cursor)));
            }
        }

        function renderResults(results, keyword) {
            const fragment = document.createDocumentFragment();
            results.forEach(function(item, index) {
                const keywordRegex = buildKeywordRegex(collectHighlightKeywords(item, keyword));
                const href = "/blog.html?path=" + encodeURIComponent(item.url || "") +
                    "&title=" + encodeURIComponent(item.title || "");
                const link = document.createElement("a");
                link.className = "result-item";
                link.href = href;
                link.innerHTML =
                    '<span class="result-date">' + String(index + 1).padStart(2, "0") + '</span>' +
                    '<span>' +
                    '<span class="result-title"></span>' +
                    '<span class="result-desc"></span>' +
                    '<span class="result-path"></span>' +
                    '</span>';
                appendHighlightedText(link.querySelector(".result-title"), item.title || "Untitled", keywordRegex);
                appendHighlightedText(link.querySelector(".result-desc"), item.desc || "暂无摘要", keywordRegex);
                link.querySelector(".result-path").textContent = item.url || "";
                fragment.appendChild(link);
            });
            resultList.appendChild(fragment);
        }
    </script>
</body>

</html>
